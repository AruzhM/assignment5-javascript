<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Events</title>
    <link rel="stylesheet" href="styles.css">
    <script src="events.js" defer></script>
</head>
<body>

    <header>
        <h1>JavaScript Events</h1>
        <p>Assignment 5 — Mouse & Keyboard Events</p>
    </header>

    <main>
        <h2>Task 5: Mouse Events</h2>
        <p>Move your mouse over the box below.</p>

        <div id="mouseBox">
            Hover over me!
        </div>

        <hr>

        <h2>Task 6: Keyboard Events</h2>
        <p>Type something in the input field.</p>

        <input
            type="text"
            id="textInput"
            placeholder="Start typing..."
        >

        <p>You typed: <span id="output"></span></p>
    </main>

</body>
</html>
