
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="calculator.js" defer></script>
</head>
<body>

    <header>
        <h1>JavaScript Calculator</h1>
        <p>Assignment 5 — Task 7: Calculator</p>
    </header>

    <main>
        <h2>Task 7: Basic Calculator</h2>
        <p>Enter two numbers and choose an operation.</p>

        <div class="calculator">

            <label for="num1">First Number:</label>
            <input type="number" id="num1" step="any">

            <label for="num2">Second Number:</label>
            <input type="number" id="num2" step="any">

            <div class="calculator-buttons">
                <button id="addBtn">+</button>
                <button id="subtractBtn">−</button>
                <button id="multiplyBtn">×</button>
                <button id="divideBtn">÷</button>
            </div>

            <h3>Result: <span id="result">0</span></h3>

        </div>
    </main>

</body>
</html>
